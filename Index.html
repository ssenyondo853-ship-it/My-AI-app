<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
    <img src="ai logo.png" alt="My AI">
    <span>MY AI</span>
</div>
        <div class="status">● Online</div>
    </header>

    <main>
        <div id="chat-box">
            <div class="welcome">
                <div class="ai-icon">✦</div>
                <h2>How can I help you?</h2>
                <p>Ask me anything about math, technology, sports and more.</p>
            </div>
        </div>

        <div class="input-area">
            <input id="user-input" type="text" placeholder="Message My AI...">
            <button id="send-btn">➤</button>
        </div>

        <div class="topics">
            <button>🧮 Math Equations</button>
            <button>💻 Technology</button>
            <button>🌱 Life Style</button>
            <button>⚽ Sports</button>
        </div>
    </main>

    <footer>
        My AI can make mistakes. Check important information.
    </footer>

    <script src="script.js"></script>

</body>
</html>
